databaseChangeLog:
  - changeSet:
      id: 2026.05.11_003_create_email_data_table
      author: mihailov.pashka@yandex.ru
      changes:
        - createTable:
            tableName: email_data
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_email_user
                    references: users(id)
              - column:
                  name: email
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
                    unique: true
