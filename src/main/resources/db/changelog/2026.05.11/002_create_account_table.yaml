databaseChangeLog:
  - changeSet:
      id: 2026.05.11_002_create_account_table
      author: mihailov.pashka@yandex.ru
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_account_user
                    references: users(id)
              - column:
                  name: balance
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: initial_balance
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
