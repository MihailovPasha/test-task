spring:
  application:
    name: test-app

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:4589}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2000ms

  sleuth:
    sampler:
      probability: 1.0
    web:
      enabled: true
    redis:
      enabled: true
    jdbc:
      enabled: true

  zipkin:
    base-url: ${ZIPKIN_URL:http://localhost:9411}
    sender:
      type: web
    enabled: ${ZIPKIN_ENABLED:true}


jwt:
  secret:
    access: ${JWT_SECRET_ACCESS:ENNBmE4TlxtYExaNse02RTIexWHOPxdSAq3RkAQJRhNwrAqbxbynXVpOiN6GnalGyNPS6dLj7nyr8qCoXgRBSD}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

server:
  port: 8080

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
